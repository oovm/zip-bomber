[package]
name = "zb-generate"
version.workspace = true
authors.workspace = true
description = "Variant drivers for zb recursive ZIP / zip-bomb generation"
categories = ["encoding"]
homepage = "https://github.com/notedge/zip-bomber"
repository = "https://github.com/notedge/zip-bomber"
documentation = "https://docs.rs/zb-generate"
readme = "readme.md"
license.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
zb-types = { workspace = true }
zb-solver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
acorn-zip = { workspace = true }
acorn-core = { workspace = true }
acorn-source = { workspace = true }

[dev-dependencies]
flate2 = "1"

[features]
default = []
