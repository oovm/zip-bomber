[package]
name = "zb-generate"
version.workspace = true
authors.workspace = true
description = "Variant drivers for zb recursive ZIP / zip-bomb generation"
categories = ["encoding"]
homepage = "https://github.com/oovm/zip-bomber"
repository = "https://github.com/oovm/zip-bomber"
documentation = "https://docs.rs/zb-generate"
readme = "readme.md"
license.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
zb-types = { workspace = true }
zb-solver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
acorn-zip = { workspace = true }
acorn-core = { workspace = true }
acorn-source = { workspace = true }
acorn-codec = { workspace = true, features = ["compression"] }

[features]
default = []
