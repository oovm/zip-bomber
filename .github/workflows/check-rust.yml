name: check-rust

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Checkout the sibling acorn.rs workspace
        run: git clone --depth 1 --branch dev https://github.com/yggdrasil-language/acorn.rs ../acorn.rs

      - uses: dtolnay/rust-toolchain@nightly
      - name: Build workspace
        run: cargo build --release
      - name: Test workspace
        run: cargo test --release
