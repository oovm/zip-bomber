# Copy to `config.toml` (gitignored) when sibling repos exist.

[patch."https://github.com/yggdrasil-language/acorn.rs.git"]
acorn-core = { path = "<your-path>/acorn.rs/projects/acorn-core" }
acorn-source = { path = "<your-path>/acorn.rs/projects/acorn-source" }
acorn-codec = { path = "<your-path>/acorn.rs/projects/acorn-codec" }
acorn-zip = { path = "<your-path>/acorn.rs/examples/acorn-zip" }

[patch."https://github.com/yggdrasil-language/oak.rs.git"]
oak-core = { path = "<your-path>/oaks/projects/oak-core" }
oak-markdown = { path = "<your-path>/oaks/examples/oak-markdown" }
oak-notedown = { path = "<your-path>/oaks/examples/oak-notedown" }
oak-html = { path = "<your-path>/oaks/examples/oak-html" }
oak-xml = { path = "<your-path>/oaks/examples/oak-xml" }
